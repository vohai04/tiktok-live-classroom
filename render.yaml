services:
  - type: web
    name: tiktok-live-classroom
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CLASSROOM_CLOUD
        value: "1"
      - key: CLASSROOM_TTS
        value: edge
      - key: CLASSROOM_VOICE
        value: vi-VN-NamMinhNeural
      - key: ADMIN_PASSWORD
        sync: false
